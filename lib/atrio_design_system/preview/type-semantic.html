<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 22px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg3); margin-bottom: 8px; }
.kicker { font-weight: 600; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg3); }
.meta { font-size: 13px; color: var(--fg3); }
.emph { font-weight: 500; font-size: 15px; color: var(--fg1); }
.lede { font-weight: 300; font-size: 19px; line-height: 1.3; letter-spacing: -0.01em; color: var(--fg2); }
</style>
</head>
<body>
<div class="card">
  <div class="cols">
    <div>
      <div class="label">Kicker</div>
      <div class="kicker">Inventario · AMM</div>
    </div>
    <div>
      <div class="label">Meta</div>
      <div class="meta">Subió hace 2h · 240 m²</div>
    </div>
    <div>
      <div class="label">Emphasis</div>
      <div class="emph">Abajo de ocho millones.</div>
    </div>
    <div style="grid-column: 1 / -1; margin-top: 6px;">
      <div class="label">Lede (300 Light)</div>
      <div class="lede">Tu inventario ya está visible para otros 49 brokers. La red funciona porque todos mantenemos la información vigente.</div>
    </div>
  </div>
</div>
</body>
</html>
