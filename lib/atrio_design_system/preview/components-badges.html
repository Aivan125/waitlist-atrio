<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.row:last-child { margin-bottom: 0; }
.lab { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg3); min-width: 80px; }
.chip {
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.02em;
  padding: 5px 10px;
  border-radius: 4px;
  border: 1px solid rgba(15,14,12,0.22);
  color: var(--fg1);
}
.chip--solid { background: var(--atrio-black); color: var(--fg1-inv); border-color: transparent; }
.chip--upper { text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px; font-weight: 600; padding: 4px 9px; }
.chip--pill { border-radius: 999px; }
.chip--ghost { background: rgba(15,14,12,0.05); border-color: transparent; }
.chip--dot::before { content:""; display: inline-block; width: 6px; height: 6px; border-radius: 999px; background: var(--fg1); margin-right: 8px; vertical-align: middle; }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div class="lab">Status</div>
    <span class="chip chip--upper">DISPONIBLE</span>
    <span class="chip chip--upper chip--solid">EXCLUSIVA</span>
    <span class="chip chip--upper chip--ghost">EN TRATO</span>
    <span class="chip chip--upper" style="color: var(--fg3);">ARCHIVADA</span>
  </div>
  <div class="row">
    <div class="lab">Meta</div>
    <span class="chip">Valle Alto</span>
    <span class="chip">240 m²</span>
    <span class="chip">3 rec</span>
    <span class="chip">$8.4M MXN</span>
  </div>
  <div class="row">
    <div class="lab">Indicator</div>
    <span class="chip chip--pill chip--dot">Live · 49 brokers</span>
    <span class="chip chip--pill chip--ghost">Nuevo</span>
  </div>
</div>
</body>
</html>
