<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.row { display: grid; grid-template-columns: 90px 1fr 160px; align-items: baseline; gap: 18px; padding: 10px 0; border-bottom: 1px solid var(--fg4); }
.row:last-child { border-bottom: 0; }
.w { font-size: 13px; color: var(--fg3); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
.s-thin     { font-weight: 100; font-size: 34px; letter-spacing: -0.02em; }
.s-light    { font-weight: 300; font-size: 30px; letter-spacing: -0.01em; }
.s-regular  { font-weight: 400; font-size: 22px; }
.s-medium   { font-weight: 500; font-size: 22px; }
.s-semibold { font-weight: 600; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; }
.use { font-size: 12px; color: var(--fg3); text-align: right; }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div class="w">Thin 100</div>
    <div class="s-thin">50</div>
    <div class="use">Numbers · 80px+</div>
  </div>
  <div class="row">
    <div class="w">Light 300</div>
    <div class="s-light">La red de brokers.</div>
    <div class="use">All titles / headings</div>
  </div>
  <div class="row">
    <div class="w">Regular 400</div>
    <div class="s-regular">Red exclusiva de brokers.</div>
    <div class="use">Body · UI · messages</div>
  </div>
  <div class="row">
    <div class="w">Medium 500</div>
    <div class="s-medium">Súbelo antes del viernes.</div>
    <div class="use">Emphasis · subheads</div>
  </div>
  <div class="row">
    <div class="w">SemiBold 600</div>
    <div class="s-semibold">VERSIÓN 1.2 · ABRIL 2026</div>
    <div class="use">Labels uppercase</div>
  </div>
</div>
</body>
</html>
