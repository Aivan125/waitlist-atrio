<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.wa {
  background: #E5DDD5;
  padding: 20px 16px;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 14px;
}
.bubble {
  max-width: 75%;
  padding: 8px 12px 10px;
  border-radius: 8px;
  position: relative;
  line-height: 1.35;
  font-family: -apple-system, "Helvetica Neue", sans-serif;
  color: #111B21;
}
.bubble--in { background: #FFFFFF; align-self: flex-start; border-bottom-left-radius: 2px; }
.bubble--out { background: #DCF8C6; align-self: flex-end; border-bottom-right-radius: 2px; }
.time { display: block; font-size: 10px; color: rgba(0,0,0,0.4); text-align: right; margin-top: 2px; }
.ctx { font-family: var(--font-sans); font-size: 11px; color: var(--fg3); margin-top: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="wa">
    <div class="bubble bubble--out">Tres recámaras en Valle, abajo de ocho millones.<span class="time">10:42</span></div>
    <div class="bubble bubble--in">Tengo 4 matches. El más fresco subió hace 2h — Casa en privada, 240 m², $8.4M. ¿Te paso el contacto?<span class="time">10:42</span></div>
    <div class="bubble bubble--out">Sí, mándamelo.<span class="time">10:43</span></div>
  </div>
  <div class="ctx">WhatsApp surface · la única interfaz del producto</div>
</div>
</body>
</html>
