<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.prop {
  padding: 20px;
  border: 1px solid var(--fg4);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.prop__img {
  aspect-ratio: 16 / 9;
  background: linear-gradient(135deg, rgba(15,14,12,0.08), rgba(15,14,12,0.16));
  border-radius: 4px;
  position: relative;
  margin-bottom: 4px;
  font-size: 10px;
  color: var(--fg3);
  display: flex;
  align-items: flex-end;
  justify-content: flex-start;
  padding: 8px 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.kicker { font-weight: 600; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg3); }
.title { font-weight: 300; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; color: var(--fg1); }
.meta { display: flex; gap: 14px; font-size: 12px; color: var(--fg2); font-variant-numeric: tabular-nums; }
.price { font-weight: 100; font-size: 30px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.foot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 6px; border-top: 1px solid var(--fg4); }
.b { font-size: 11px; color: var(--fg3); }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div class="prop">
      <div class="prop__img">LUZ · SOMBRA · MATERIAL</div>
      <div class="kicker">Valle Alto · Exclusiva</div>
      <div class="title">Casa en privada, 3 recámaras.</div>
      <div class="meta"><span>240 m²</span><span>· 3 rec</span><span>· 4 baños</span></div>
      <div class="foot"><span class="price">$8.4M</span><span class="b">Subió hace 2h</span></div>
    </div>
    <div class="prop" style="background: var(--atrio-black); border-color: transparent; color: var(--fg1-inv);">
      <div class="prop__img" style="background: linear-gradient(135deg, rgba(243,238,229,0.08), rgba(243,238,229,0.16)); color: rgba(243,238,229,0.45);">LUZ · SOMBRA · MATERIAL</div>
      <div class="kicker" style="color: rgba(243,238,229,0.45);">San Pedro · En trato</div>
      <div class="title" style="color: var(--fg1-inv);">Departamento con vista.</div>
      <div class="meta" style="color: rgba(243,238,229,0.65);"><span>190 m²</span><span>· 2 rec</span><span>· 2 baños</span></div>
      <div class="foot" style="border-top-color: rgba(243,238,229,0.12);"><span class="price">$6.2M</span><span class="b" style="color: rgba(243,238,229,0.45);">Hace 1 día</span></div>
    </div>
  </div>
</div>
</body>
</html>
