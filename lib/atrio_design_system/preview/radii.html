<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.radii { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
.demo {
  height: 90px;
  background: var(--atrio-black);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 8px;
}
.name { font-size: 11px; color: var(--fg1); font-weight: 500; margin-top: 8px; text-align: center; }
.val { font-size: 10px; color: var(--fg3); text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: 0.08em; margin-top: 2px; }
</style>
</head>
<body>
<div class="card">
  <div class="radii">
    <div><div class="demo" style="border-radius:0;"></div><div class="name">none</div><div class="val">0</div></div>
    <div><div class="demo" style="border-radius:2px;"></div><div class="name">xs</div><div class="val">2</div></div>
    <div><div class="demo" style="border-radius:4px;"></div><div class="name">sm</div><div class="val">4</div></div>
    <div><div class="demo" style="border-radius:6px;"></div><div class="name">md · default</div><div class="val">6</div></div>
    <div><div class="demo" style="border-radius:10px;"></div><div class="name">lg · ceiling</div><div class="val">10</div></div>
    <div><div class="demo" style="border-radius:999px;"></div><div class="name">pill · avatars</div><div class="val">999</div></div>
  </div>
</div>
</body>
</html>
