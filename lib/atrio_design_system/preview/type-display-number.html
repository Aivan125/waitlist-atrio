<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.stage { display: flex; align-items: baseline; gap: 28px; }
.big { font-weight: 100; font-size: 160px; line-height: 0.9; letter-spacing: -0.04em; color: var(--fg1); font-variant-numeric: tabular-nums; }
.meta { flex: 1; }
.kicker { font-weight: 600; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg3); margin-bottom: 10px; }
.lede { font-weight: 300; font-size: 22px; line-height: 1.25; letter-spacing: -0.01em; color: var(--fg1); margin-bottom: 10px; }
.body { font-size: 14px; color: var(--fg2); line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <div class="stage">
    <div class="big">50</div>
    <div class="meta">
      <div class="kicker">Masa crítica</div>
      <div class="lede">brokers. Un inventario. Cero grupos saturados.</div>
      <div class="body">Geist Thin 100, 80&nbsp;px+. Números como protagonistas — la jerarquía la carga el tamaño, no el peso.</div>
    </div>
  </div>
</div>
</body>
</html>
