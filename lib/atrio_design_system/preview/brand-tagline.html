<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.q { font-weight: 300; font-size: 30px; line-height: 1.2; letter-spacing: -0.02em; color: var(--fg1); margin-bottom: 14px; text-wrap: balance; }
.attr { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg3); }
.rule { height: 1px; background: var(--fg4); margin: 16px 0; }
.sub { font-size: 13px; color: var(--fg2); }
</style>
</head>
<body>
<div class="card">
  <div class="attr">Tagline · institucional</div>
  <div class="rule"></div>
  <div class="q">&ldquo;Tu red de propiedades de alto nivel, a un mensaje de WhatsApp.&rdquo;</div>
  <div class="sub">Geist 300 Light · 30&nbsp;px · <em>pretty</em> wrap · sin signos de exclamación.</div>
</div>
</body>
</html>
