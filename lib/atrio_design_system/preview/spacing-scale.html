<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.scale { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding-top: 10px; }
.step { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.bar { background: var(--atrio-black); width: 14px; border-radius: 1px; }
.val { font-size: 11px; color: var(--fg3); font-weight: 600; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
.name { font-size: 10px; color: var(--fg3); }
</style>
</head>
<body>
<div class="card">
  <div class="scale">
    <div class="step"><div class="bar" style="height:4px;"></div><div class="val">4</div><div class="name">space-1</div></div>
    <div class="step"><div class="bar" style="height:8px;"></div><div class="val">8</div><div class="name">space-2</div></div>
    <div class="step"><div class="bar" style="height:12px;"></div><div class="val">12</div><div class="name">space-3</div></div>
    <div class="step"><div class="bar" style="height:16px;"></div><div class="val">16</div><div class="name">space-4</div></div>
    <div class="step"><div class="bar" style="height:24px;"></div><div class="val">24</div><div class="name">space-5</div></div>
    <div class="step"><div class="bar" style="height:32px;"></div><div class="val">32</div><div class="name">space-6</div></div>
    <div class="step"><div class="bar" style="height:48px;"></div><div class="val">48</div><div class="name">space-7</div></div>
    <div class="step"><div class="bar" style="height:64px;"></div><div class="val">64</div><div class="name">space-8</div></div>
    <div class="step"><div class="bar" style="height:96px;"></div><div class="val">96</div><div class="name">space-9</div></div>
    <div class="step"><div class="bar" style="height:128px;"></div><div class="val">128</div><div class="name">space-10</div></div>
  </div>
</div>
</body>
</html>
